name: wache
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
    inputs: {testalarm: {type: boolean, default: false}}
permissions: {contents: write}
concurrency: wache
jobs:
  wache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIL_AN: ${{ secrets.MAIL_AN }}
      MAIL_VON: ${{ secrets.MAIL_VON }}
      SMTP_BENUTZER: ${{ secrets.SMTP_BENUTZER }}
      SMTP_PASSWORT: ${{ secrets.SMTP_PASSWORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Zustand holen
        run: |
          mkdir -p state
          git fetch origin zustand 2>/dev/null && git show origin/zustand:zustand.json > state/zustand.json || true
      - run: pip install "httpx[http2]"
      - run: python wache.py ${{ inputs.testalarm && 'test-alarm' || '' }}
      - name: Zustand sichern
        if: always()
        run: |
          [ -f state/zustand.json ] || exit 0
          git fetch origin zustand 2>/dev/null && git show origin/zustand:zustand.json 2>/dev/null | cmp -s - state/zustand.json && exit 0
          d=$(mktemp -d); cp state/zustand.json $d/; cd $d
          git init -q -b zustand; git config user.name wache; git config user.email wache@users.noreply.github.com
          git add zustand.json; git commit -qm zustand
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" zustand
